# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: 'Message correction'

evaluateOptions:
  maxConcurrency: 4

prompts:
  - file://prompt.ts

providers:
  - id: 'openai:{{ env.LLM_MODEL }}'
    config:
      max_completion_tokens: 2048
      reasoning_effort: 'low'

tests:
  # Already-correct messages: the corrector should return no steps.
  - description: 'es: "a donde sea" is a valid phrase'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Quiero practicar para mi viaje
        - role: assistant
          content: ¿Ya sabes a qué país vas?
        - role: user
          content: quiero ir a donde sea

  - description: 'es: "adonde sea" written as one word is also valid'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Quiero practicar para mi viaje
        - role: assistant
          content: ¿Ya sabes a qué país vas?
        - role: user
          content: quiero ir adonde sea

  - description: 'es: "donde sea" without the preposition is also valid'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Quiero practicar para mi viaje
        - role: assistant
          content: ¿Ya sabes a qué país vas?
        - role: user
          content: me da igual, voy donde sea

  - description: 'es: "no me queda otra" is idiomatic'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Tengo que trabajar el sábado
        - role: assistant
          content: ¿No puedes cambiarlo?
        - role: user
          content: no me queda otra, el proyecto se entrega el lunes

  - description: 'es: subjunctive after "da igual que"'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: ¿Salimos mañana?
        - role: assistant
          content: ¿Y si llueve?
        - role: user
          content: da igual que llueva, igual salimos

  - description: 'es: "quizás" plus subjunctive'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Estoy pensando en ir al sur
        - role: assistant
          content: ¿Cuándo te irías?
        - role: user
          content: quizás vaya la próxima semana

  - description: 'es: "hubiese" instead of "hubiera"'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Llegué tarde a la reunión
        - role: assistant
          content: ¿Qué pasó?
        - role: user
          content: si hubiese sabido que era a las ocho, habría salido antes

  - description: 'es: dative "se me hizo tarde"'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Perdón por la demora
        - role: assistant
          content: ¿Todo bien?
        - role: user
          content: sí, se me hizo tarde en el trabajo

  - description: 'es: one-shot with no chat context'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Escribes un mensaje suelto, sin una conversación delante. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. Es un mensaje aislado.'
        want: 'Decir lo que el mensaje ya intenta decir.'
      turns:
        - role: user
          content: por mí, lo que sea

  - description: 'en: "i don''t feel like" is idiomatic and the lowercase start is fine'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: es
      targetLanguage: en
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: I had a rough week
        - role: assistant
          content: Any plans for the weekend?
        - role: user
          content: i don't feel like going out tonight

  - description: 'en: "whatever works for you" is idiomatic'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: es
      targetLanguage: en
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Should we meet at six or seven?
        - role: assistant
          content: Either works for me. You pick.
        - role: user
          content: whatever works for you is fine

  - description: 'en: one-shot with no chat context'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: es
      targetLanguage: en
      scene:
        you: 'Escribes un mensaje suelto, sin una conversación delante. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. Es un mensaje aislado.'
        want: 'Decir lo que el mensaje ya intenta decir.'
      turns:
        - role: user
          content: i ended up staying home all weekend

  # Messages with real errors.
  - description: 'es: tense, plural and gender'
    assert:
      - type: javascript
        value: 'output.steps.length > 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Quiero contarte de mi fin de semana
        - role: assistant
          content: ¡Cuéntame! ¿Qué hiciste?
        - role: user
          content: Yo comprar dos libro nuevo la semana pasado

  - description: 'es: "ser" instead of "estar" for a passing state'
    assert:
      - type: javascript
        value: 'output.steps.length > 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: ¿Cómo está tu amiga?
        - role: assistant
          content: Cuéntame de ella, ¿qué ha estado haciendo?
        - role: user
          content: Mi amiga es cansada porque ella trabajó mucho ayer

  - description: 'en: subject-verb agreement and plural'
    assert:
      - type: javascript
        value: 'output.steps.length > 0'
    vars:
      nativeLanguage: es
      targetLanguage: en
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Do you like animals?
        - role: assistant
          content: I do! Do you have any pets?
        - role: user
          content: She have two cat and they is very playful

  - description: 'en: past tense with "yesterday"'
    assert:
      - type: javascript
        value: 'output.steps.length > 0'
    vars:
      nativeLanguage: es
      targetLanguage: en
      scene:
        you: 'Eres un aprendiz. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. El tema lo pone quien habla y puede cambiar. La conversación dura lo que el aprendiz quiera.'
        want: 'Practicar el idioma. No hay una meta que dé por cerrada la conversación.'
      turns:
        - role: user
          content: Hi, I want to talk about last weekend
        - role: assistant
          content: Sure, what did you do?
        - role: user
          content: I have go to the party yesterday and we dancing all night

  # Messages with an intent: it disambiguates, it is not a text to translate.
  - description: 'es: intent exposes a false friend ("soportar" is not "to support")'
    assert:
      - type: javascript
        value: 'output.steps.length > 0 && /apoy/i.test(output.steps.at(-1).sentence)'
    vars:
      nativeLanguage: en
      targetLanguage: es
      intent: I want to say I support your decision to change jobs
      scene:
        you: 'Escribes un mensaje suelto, sin una conversación delante. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. Es un mensaje aislado.'
        want: 'Decir lo que el mensaje ya intenta decir.'
      turns:
        - role: user
          content: Soporto tu decisión de cambiar de trabajo

  # Same sentence, no intent: it is valid Spanish, so nothing to correct.
  - description: 'es: without an intent, "soporto tu decisión" is left alone'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      scene:
        you: 'Escribes un mensaje suelto, sin una conversación delante. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. Es un mensaje aislado.'
        want: 'Decir lo que el mensaje ya intenta decir.'
      turns:
        - role: user
          content: Soporto tu decisión de cambiar de trabajo

  - description: 'es: intent says more than the message, but the message is correct'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: en
      targetLanguage: es
      intent: I want to ask my coworker if she can send me the report before Friday, because the
        client has been waiting for it all week
      scene:
        you: 'Escribes un mensaje suelto, sin una conversación delante. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. Es un mensaje aislado.'
        want: 'Decir lo que el mensaje ya intenta decir.'
      turns:
        - role: user
          content: ¿Me puedes mandar el reporte antes del viernes?

  - description: 'en: intent exposes a false friend ("constipated" is not "resfriado")'
    assert:
      - type: javascript
        value: 'output.steps.length > 0 && !/constipated/i.test(output.steps.at(-1).sentence)'
    vars:
      nativeLanguage: es
      targetLanguage: en
      intent: Quiero avisar que estoy resfriado y que no iré a la oficina
      scene:
        you: 'Escribes un mensaje suelto, sin una conversación delante. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. Es un mensaje aislado.'
        want: 'Decir lo que el mensaje ya intenta decir.'
      turns:
        - role: user
          content: I am constipated and I will not go to the office

  - description: 'en: intent says more than the message, but the message is correct'
    assert:
      - type: javascript
        value: 'output.steps.length === 0'
    vars:
      nativeLanguage: es
      targetLanguage: en
      intent: Quiero decirle a mi equipo que terminé la tarea y que subí los cambios al repositorio,
        y que pueden revisarlos cuando quieran
      scene:
        you: 'Escribes un mensaje suelto, sin una conversación delante. Te expresas como tú mismo, en el tono que elijas.'
        shared: 'No hay lugar ni trama. Es un mensaje aislado.'
        want: 'Decir lo que el mensaje ya intenta decir.'
      turns:
        - role: user
          content: i finished the task and pushed the changes
